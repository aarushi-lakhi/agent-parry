[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-parry"
version = "0.1.0"
description = "AgentParry: scan, protect, and verify autonomous AI agents against prompt injection, data exfiltration, and privilege escalation."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pyyaml",
    "pydantic",
    "rich",
    "httpx",
    "json5",
]

[project.scripts]
agentparry = "src.cli:main"
agentparry-proxy = "src.proxy:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.15.17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    # Suggested ternary is over 100 chars; the if/else block reads better.
    "SIM108",
    # PolicyAction is str+Enum. StrEnum is safe here but changing the core
    # policy enum belongs in its own PR, not a lint-setup one.
    "UP042",
]
