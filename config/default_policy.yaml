rules:
- name: autogen_pi-003
  tool: email_send
  action: BLOCK
  message: blocks base64-encoded credential file exfiltration in email body
  description: blocks base64-encoded credential file exfiltration in email body
  conditions:
  - type: pattern_match
    field: body
    patterns:
    - /etc/(?:passwd|shadow|sudoers)
    normalize:
      decoded: true
- name: autogen_pi-004
  tool: email_send
  action: BLOCK
  message: blocks safety override in email body
  description: blocks safety override in email body
  conditions:
  - type: pattern_match
    field: body
    patterns:
    - disregard\s+(?:all|any|every|the\s+(?:previous|prior|earlier|preceding|above|system|safety))\b.{0,30}\b(?:rules|instructions|guidelines|policies|restrictions|directives)\b|override\s+(?:your|all|the)\s+(?:safety|security)\b
- name: autogen_pe-004
  tool: shell_exec
  action: BLOCK
  message: blocks SUID bit escalation
  description: blocks SUID bit escalation
  conditions:
  - type: pattern_match
    field: command
    patterns:
    - chmod\s+\+s
- name: autogen_pl-003
  tool: email_send
  action: BLOCK
  message: blocks emails containing SSN or credit card numbers
  description: blocks emails containing SSN or credit card numbers
  conditions:
  - type: pattern_match
    field: body
    patterns:
    - \d{3}-\d{2}-\d{4}
    - 4\d{3}[-\s]?\d{4}
- name: block_dangerous_shell
  tool: shell_exec
  action: block
  conditions:
  - type: pattern_match
    field: command
    patterns:
    - (?:^|[\n;&|(`]|\$\()\s*rm\s+-rf
    - (?:^|[\n;&|(`]|\$\()\s*curl.*\|\s*(?:sudo\s+)?(?:\S*/)?(?:sh|bash|dash|zsh|ksh|csh|fish)\b
    - (?:^|[\n;&|(`]|\$\()\s*wget.*\|\s*(?:sudo\s+)?(?:\S*/)?(?:sh|bash|dash|zsh|ksh|csh|fish)\b
    - chmod\s+777
    - (?:^|[\n;&|(`]|\$\()\s*sudo\s+
  message: 'Blocked: dangerous shell command'
- name: block_data_exfil
  tool: shell_exec
  action: block
  conditions:
  - type: pattern_match
    field: command
    patterns:
    - curl.*-d\s
    - curl.*--data
    - wget.*--post
    - \|\s*nc\s
    - \|\s*netcat
  message: 'Blocked: possible data exfiltration'
- name: block_sensitive_file_paths
  tool: file_read
  action: block
  conditions:
  - type: path_containment
    field: path
    denied_paths:
    - /etc
    - /proc
    - /sys
    - /root
    - /var/run/secrets
    - etc/passwd
    - etc/shadow
    - etc/sudoers
    - .ssh
    - .aws/credentials
    - .gnupg
    normalize:
      canonical: true
      decoded: true
  message: 'Blocked: read of a sensitive system path'
- name: block_file_read_outside_roots
  tool: file_read
  action: block
  conditions:
  - type: path_containment
    field: path
    allowed_roots:
    - /home/user
    - /var/log
    - /tmp
    normalize:
      canonical: true
      decoded: true
  message: 'Blocked: file read outside the allowed roots'
- name: flag_external_email
  tool: email_send
  action: require_approval
  conditions:
  - type: domain_allowlist
    field: to
    allowed_domains:
    - company.com
    - internal.org
  message: Email to external domain requires approval
settings:
  log_all_calls: true
  log_file: agentparry.log
  normalization:
    enabled: true
    canonical: true
    decoded: false
  result_inspection:
    enabled: true
    action: neutralize
    severity_threshold: high
    exempt_tools: []
  terminal_sanitization:
    enabled: true
    action: strip
    exempt_tools: []
  metadata_inspection:
    enabled: true
    action: redact
    severity_threshold: critical
    exempt_tools: []
  taint_tracking:
    enabled: false
    action: flag
    exempt_tools: []
  tool_pinning:
    enabled: true
    action: warn
    lock_timeout: 2.0
    last_seen_interval: 86400.0
