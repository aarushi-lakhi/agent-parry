name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Tests resolve config/default_policy.yaml and attacks/payloads.yaml
      # relative to cwd, so they must run from the repo root.
      - name: Tests
        run: pytest tests/ -q
      - name: Lint
        run: ruff check src tests
      # Exits 3 on a high-severity finding; medium is review advice, not a gate.
      - name: Policy lint
        run: agentparry lint-policy --fail-on high
